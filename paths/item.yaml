get:
  summary: Detail školy podle ID nebo RED IZO
  description: >
    Endpoint vrací informace o jedné škole. Školu lze vyhledat pomocí
    parametru `id` (ID školy v databázi) nebo pomocí `red_izo` (RED IZO školy).
    Parametr `scope` určuje rozsah vrácených dat:
    - `basic` – základní informace o škole
    - `mid` – základ + adresa, emaily, ředitel
    - `all` – všechna data o škole (včetně budov, kapacit, oborů a míst výkonu činnosti)

  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      example: "Bearer 60ce5d18baec29c018260bb77732d847"
      description: >
        Autorizační token ve formátu `Bearer <token>`. Bez tohoto tokenu (nebo pokud vypršela 
        jeho 10minutová platnost) nebude přístup k datům povolen.
        
    - in: query
      name: id
      required: false
      schema:
        type: integer
        minimum: 1
      description: >
        Interní ID školy. Pokud není zadáno, použije se hodnota 1.
        Musí být v rozsahu existujících ID v databázi, jinak se vypíše error.

    - in: query
      name: red_izo
      required: false
      schema:
        type: string
        pattern: "^[6][0-9]{8}$"
      description: >
        RED IZO školy. Musí mít 9 číslic a začínat číslem 6.

    - in: query
      name: scope
      required: false
      schema:
        type: string
        enum: [basic, mid, all]
        default: basic
      description: >
        Určuje rozsah vrácených dat:
        - basic: základní informace
        - mid: základ + adresa, emaily, ředitel
        - all: všechna data o škole (včetně budov, kapacit, oborů a míst výkonu činnosti)
  responses:
    '200':
      description: Úspěšná odpověď s detailem školy
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  total_count:
                    type: integer
                    description: Celkový počet škol v databázi
                  info:
                    type: object
                    properties:
                      self: { type: integer, description: "id současné školy, která je zobrazena" }
                      last: { type: integer , description: "id poslední školy v databázi"}
                      previous:
                        type: integer
                        nullable: true
                        description: id předchozí školy, může být null, pokud není žádná předchozí škola
                      next:
                        type: integer
                        nullable: true
                        description: id další školy, může být null, pokud není žádná další škola

              data:
                type: object
                properties:
                  s_id: { type: integer, description: "id současné školy v db, která je zobrazena" }
                  s_red_izo: { type: string, description: "red izo (rezortní identifikátor) současné školy, která je zobrazena" }
                  s_ico: { type: integer , description: "ičo školy"}
                  s_dis: { type: string , description: "název kraje ve kterém se škola nacházi"}
                  s_full_name: { type: string , description: "úplný název školy"}
                  s_nick: { type: string , description: "zkrácený název školy"}
                  s_legal_form: { type: string , description: "právní forma školy"}
                  s_estab_type: { type: string , description: "typ zřizovatele"}

                  address:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        a_street: { type: string , description: "ulice"}
                        a_h_num: { type: integer , description: "domovní číslo"}
                        a_type_h: { type: string , description: "typ domovního čísla"}
                        a_d_num: { type: integer , description: "číslo obce"}
                        a_reg: { type: string , description: "obec"}
                        a_reg_part: { type: string , description: "část obce"}
                        a_num_reg_p: { type: string , description: "číslo obvodu Prahy"}
                        a_psc: { type: string , description: "poštovní směrovací číslo"}
                        a_ruian: { type: integer , description: "ruian"}
                        a_dis: { type: string , description: "okres"}

                  emails:
                    type: array
                    description: Pole s emaily na kontaktní osoby školy
                    nullable: true
                    items:
                      type: string

                  principal:
                    type: object
                    description: Pole s údaji o řediteli
                    nullable: true
                    properties:
                      p_per: { type: string, description: "Jméno ředitele" }
                      p_stat: { type: boolean , description: "zda je osoba statutár"}
                      p_creation_fc:
                        type: string
                        format: date
                        description: datum vzniku funkce, formát YYYY-MM-DD

                  building:
                    type: array
                    description: Pole s údaji o zařízení spadající pod školu
                    nullable: true
                    items:
                      type: object
                      properties:
                        b_izo: { type: string, description:"izo budovy"}
                        b_full_name: { type: string , description:"úplný název zařízení"}
                        b_type: { type: string , description:"druh zařízení"}
                        b_lang: { type: string , description:"jazyk"}
                        b_date_or:
                          type: string
                          format: date
                          description: Datum zápisu ve formátu YYYY-MM-DD
                        b_date_work:
                          type: string
                          format: date
                          description: Datum činosti od, ve formátu YYYY-MM-DD

                        capacity:
                          type: array
                          items:
                            type: object
                            properties:
                              c_unit: { type: string, description:"měrná jednotka kapacity" }
                              c_count: { type: integer , description:"kapacita - počet" }

                        fields:
                          type: array
                          description: pole s dostupnými obory na škole
                          items:
                            type: object
                            properties:
                              f_code: { type: string , description:"kód oboru"}
                              f_name: { type: string , description:"název oboru" }
                              f_form_edu: { type: string , description:"typ vzdělávání" }
                              f_len_edu: { type: string , description:"délka vzdělávání" }
                              f_lang: { type: string , description:"jazyk oboru" }
                              f_capacity: { type: integer , description:"kapacita oboru" }
                              f_unit: { type: string , description:"měrná jednotka kapacity" }
                              f_ending: { type: boolean , description:"dobíhající obor" }

                        places:
                          type: array
                          items:
                            type: object
                            properties:
                              pl_id: { type: string , description:"id místa kde se zařízení nachází" }
                              pl_type: { type: string , description:"typ místa" }
                              pl_street: { type: string , description:"ulice" }
                              pl_h_num: { type: integer , description:"domovní číslo" }
                              pl_type_h: { type: string , description:"typ domovního čísla" }
                              pl_d_num: { type: integer , description:"číslo obce" }
                              pl_reg: { type: string , description:"obec" }
                              pl_reg_part: { type: string , description:"část obce" }
                              pl_num_reg_p: { type: string , description:"číslo obvodu Prahy" }
                              pl_psc: { type: string , description:"poštovní směrovací číslo" }
                              pl_ruian: { type: integer , description:"ruian" }
                              pl_dis: { type: string , description:"okres" }

          examples:
            scope_all_example:
              summary: Ukázkový výstup pro scope=all
              value:
                meta:
                  total_count: 9954
                  info:
                    self: 7591
                    last: 9954
