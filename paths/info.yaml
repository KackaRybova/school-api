get:
  summary: Vrátí základní informace o API a databázi
  description: >
    Endpoint vrací základní informace o API a stavu připojení k databázi.
  
  parameters:
    - in: header
      name: Authorization
      required: true
      schema:
        type: string
      example: "Bearer 60ce5d18baec29c018260bb77732d847"
      description: >
        Autorizační token ve formátu `Bearer <token>`. Bez tohoto tokenu (nebo pokud vypršela 
        jeho 10minutová platnost) nebude přístup k datům povolen.
  
  responses:
    '200':
      description: Úspěšná odpověď
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
                description: Status odpovědi
              data:
                type: object
                description: JSON objekt s daty
                properties:
                  name:
                    type: string
                    description: Jméno API
                  api_author:
                    type: string
                    description: Autor API
                  api_version:
                    type: string
                    description: Verze API
                  docs:
                    type: string
                    description: Odkaz na dokumentaci
                  supported_formats:
                    type: array
                    description: Pole podporovaných formátů
                    items:
                      type: string
                  utc_time:
                    type: string
                    format: date-time
                    description: Čas na serveru ve formátu YYYY-MM-DD HH:MM:SS (ISO 8601)  
                  db_info:
                    type: object
                    description: JSON objekt s informacemi o databázi
                    properties:
                      connected:
                        type: boolean
                        description: Stav připojení k databázi
                      db_time:
                        type: string
                        nullable: true
                        description: Čas databáze ve formátu YYYY-MM-DD HH:MM:SS. Může být null, pokud db není připojeno
                      db_version:
                        type: string
                        nullable: true
                        description: Verze databáze. Může být null, pokud db není připojeno
                      error:
                        type: string
                        nullable: true
                        description: Chybová hláška při selhání připojení k databázi. Může být null, pokud je db připojeno
                  server_info:
                    type: string
                    description: Informace o serveru
                  php_version:
                    type: string
                    description: Verze PHP

          examples:
            ok:
              value:
                status: 200
                data:
                  name: "School API"
                  api_author: "rybovka"
                  api_version: "1.0.0"
                  docs: "https://s-api.gitbook.io/s_api"
                  supported_formats:
                    - "json"
                  utc_time: "2026-02-02T18:24:50Z"
                  db_info:
                    connected: true
                    db_time: "2026-02-02 19:26:18"
                    db_version: "5.5.68-MariaDB"
                  server_info: "Linux public 5.14.0-611.16.1.el9_7.x86_64"
                  php_version: "8.5.1"

            db_down:
              value:
                status: 200
                data:
                  name: "School API"
                  api_author: "rybovka"
                  api_version: "1.0.0"
                  docs: "https://s-api.gitbook.io/s_api"
                  supported_formats:
                    - "json"
                  utc_time: "2026-02-02T18:24:50Z"
                  db_info:
                    connected: false
                    error: "chybova hlaska"
                  server_info: "Linux public 5.14.0-611.16.1.el9_7.x86_64"
                  php_version: "8.5.1"

    '401':
      description: Neautorizovaný přístup (chybějící, neplatný nebo expirovaný token)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: status odpovědi
              error:
                type: string
                description: chybová hláška
          examples:
            missing_header:
              summary: Chybyjící hlavička Authorization
              value:
                status: 401
                error: "Chybi autorizacni hlavicka (Authorization)"
            invalid_token:
              summary: Neplatný nebo expirovaný token
              value:
                status: 401
                error: "Neplatny nebo expirovany token. Vygenerujte si novy."
    '400':
      description: Chybná metoda. Nutno použít GET
      content:
        application/json:
          example:
            status: 400
            error: "nespravna metoda, pouzijte GET"
          schema:
            type: object
            properties:
              status:
                type: integer
                description: Status odpovědi
              error:
                type: string
                description: Chybová hláška
